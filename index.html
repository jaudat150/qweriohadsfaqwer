<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #my-button { padding: 12px 24px; border: none; color: white; font-size: 16px; cursor: pointer; border-radius: 5px; }
        .admin-link { margin-top: 30px; display: inline-block; color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Elements that will be updated by the CMS -->
    <h1 id="site-title">Loading site data...</h1>
    <button id="my-button">Click Me</button>

    <!-- Link to your Admin Panel -->
    <a href="/admin/" class="admin-link">Go to Admin Panel</a>

    <script>
        // Fetch the JSON data created by Decap CMS
        fetch('/site.json') 
            .then(response => response.json())
            .then(data => {
                // Update the page title
                document.title = data.title;
                document.getElementById('site-title').innerText = data.title;
                
                // Update the button color
                document.getElementById('my-button').style.backgroundColor = data.primary_color;
            })
            .catch(error => {
                console.error('Error loading site data:', error);
                document.getElementById('site-title').innerText = 'Error loading data. Is site.json in the root folder?';
            });
    </script>
</body>
</html>
