<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Test Site</title>
  <style>
    :root { --brand-color: #007bff; } /* Default fallback color */
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    button { 
      background-color: var(--brand-color); 
      color: white; padding: 15px 30px; border: none; border-radius: 5px; 
      font-size: 16px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 id="title">Loading...</h1>
  <button>Click Me!</button>

  <script>
    // Fetch the data generated by the CMS
    fetch('/_data/site.json')
      .then(response => response.json())
      .then(data => {
        document.getElementById('title').innerText = data.title;
        // Update the CSS variable to change the button color
        document.documentElement.style.setProperty('--brand-color', data.primary_color);
      });
  </script>
</body>
</html>
